spring.application.name=mpesa

# Datasource (matches compose.yaml)
spring.datasource.url=jdbc:postgresql://localhost:54552/safari
spring.datasource.username=safari
spring.datasource.password=safari
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=2000

# JPA - schema is owned by Liquibase, Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# Docker Compose support: start the database when the app starts, leave it running on exit
spring.docker.compose.file=compose.yaml
spring.docker.compose.lifecycle-management=start-only

spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.default-property-inclusion=non_null

# OpenAPI / Swagger UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

server.tomcat.threads.max=50

# external bank
bank.base-url=http://localhost:9090
bank.connect-timeout=1s
bank.read-timeout=5s
# how often each instance looks for payouts to submit or to check on
bank.worker-interval=1s
# wait before asking the bank for a status after a submit (callback usually arrives first)
bank.poll-interval=5s
# first retry wait when the bank can't be reached; doubles up to 30s
bank.retry-interval=2s
bank.batch-size=50

# errors always come from ApiExceptionHandler in our own shape, never Spring's default page
server.error.whitelabel.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
